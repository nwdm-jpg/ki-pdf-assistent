# Design-System der AVENLOQ-App: helle, klare Arbeitsflaeche (Content)
# kombiniert mit einer dunklen Navy-Sidebar (Navigation) - die
# Markenpalette (Dark Navy, Blue -> Violet) wird ueber Streamlits native
# Theming-Optionen gesetzt, nicht per CSS-Override. Der Blue -> Violet
# Farbverlauf fuer Primaerbuttons/aktive Navigation kommt aus der
# zentralen CSS-Ergaenzung in komponenten.py (dort auch die wenigen
# strukturellen Ergaenzungen, die config.toml nicht abdecken kann).
[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F4FE"
textColor = "#0D1026"
linkColor = "#7C3AED"
font = "sans-serif"
baseRadius = "large"
buttonRadius = "large"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#0D1026"
secondaryBackgroundColor = "#171B3D"
textColor = "#EDE9FE"
primaryColor = "#7C3AED"
borderColor = "#262B52"
